# deny.toml - cargo-deny configuration
# This template was adapted from https://github.com/EmbarkStudios/cargo-deny
# Documentation: https://embarkstudios.github.io/cargo-deny/

[graph]
# All features for all dependencies should be included in the build
all-features = true

[output]
# The feature depth allows us to see features of transitive dependencies
feature-depth = 1

[advisories]
version = 2
# Deny crates with security vulnerabilities
vulnerability = "deny"
# Warn on unmaintained crates
unmaintained = "warn"
# Warn if a crate has not been updated for a long time
unsound = "warn"
# Warn if the advisory notice has not been updated for a long time
notice = "warn"
# Ignore advisories for crates that are only used in dev dependencies
ignore = []

[licenses]
version = 2
# List of allowed licenses
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "CC0-1.0",
]
# Confidence threshold for license detection
confidence-threshold = 0.8

[[licenses.exceptions]]
# tree-sitter uses MIT license
allow = ["MIT"]
name = "tree-sitter"

[[licenses.exceptions]]
# tree-sitter-rust uses MIT license
allow = ["MIT"]
name = "tree-sitter-rust"

[bans]
# Deny multiple versions of the same crate
multiple-versions = "warn"
# Warn on wildcard dependencies
wildcards = "warn"
# Allow workspace dependencies
workspace-default-features = "allow"
# Warn on crates that are not in the allow list
external-default-features = "warn"
# Highlight specific dependencies
highlight = "all"

# Skip certain crates when checking for duplicates
skip = []

# Deny certain crates
deny = []

[sources]
# Warn about crates from unknown registries
unknown-registry = "warn"
# Warn about crates from unknown git sources
unknown-git = "warn"
# Allow crates from crates.io
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Allow git dependencies from specific organizations
allow-git = []